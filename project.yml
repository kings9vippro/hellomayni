name: TouchOptimizerPro
options:
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CLANG_CXX_LANGUAGE_STANDARD: c++17
targets:
  TouchOptimizerPro:
    type: application
    platform: iOS
    sources:
      - App
      - Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.touchlab.optimizer
        PRODUCT_NAME: TouchOptimizerPro
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Touch Lab Pro
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: '3.0.0'
        CURRENT_PROJECT_VERSION: '3'
        TARGETED_DEVICE_FAMILY: '1'
        SWIFT_OBJC_BRIDGING_HEADER: App/Bridge.h
        HEADER_SEARCH_PATHS: '$(SRCROOT)/Core'
schemes:
  TouchOptimizerPro:
    build:
      targets:
        TouchOptimizerPro: all
