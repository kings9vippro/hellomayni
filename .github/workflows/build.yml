name: Build Touch Lab Pro 5 IPA
on:
  push:
    branches: [main]
    paths:
      - 'App/**'
      - 'Core/**'
      - 'Tests/**'
      - 'Config/**'
      - 'Scripts/**'
      - 'project.yml'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Pro
            bundle: com.touchlab.optimizer
            display: Touch Lab Pro
            plist: Config/Info.plist
            flags: ''
          - variant: Lite
            bundle: com.touchlab.optimizer.lite
            display: Touch Lab Lite
            plist: Config/Lite.plist
            flags: TOUCHLAB_LITE
    steps:
      - uses: actions/checkout@v4
      - name: C++ verification
        run: clang++ -std=c++17 -O2 -Wall -Wextra -I Core Core/TouchCore.cpp Tests/test.cpp -o /tmp/touch-test && /tmp/touch-test
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version
      - name: Build arm64
        env:
          BUNDLE_ID: ${{ matrix.bundle }}
          DISPLAY_NAME: ${{ matrix.display }}
          PLIST: ${{ matrix.plist }}
          FLAGS: ${{ matrix.flags }}
        run: |
          set -o pipefail
          xcodebuild -project TouchOptimizerPro.xcodeproj -scheme TouchOptimizerPro -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/derived" ARCHS=arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO "PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID" "INFOPLIST_KEY_CFBundleDisplayName=$DISPLAY_NAME" "INFOPLIST_FILE=$PLIST" "SWIFT_ACTIVE_COMPILATION_CONDITIONS=$FLAGS" build | tee "$RUNNER_TEMP/build.log"
      - name: Package and validate unsigned IPA
        env:
          VARIANT: ${{ matrix.variant }}
          BUNDLE_ID: ${{ matrix.bundle }}
        run: |
          mkdir -p dist Payload
          cp -R "$RUNNER_TEMP/derived/Build/Products/Release-iphoneos/TouchOptimizerPro.app" Payload/
          file Payload/TouchOptimizerPro.app/TouchOptimizerPro
          zip -qry "dist/TouchLab-$VARIANT-5.0.0-unsigned.ipa" Payload
          python3 Scripts/verify_ipa.py "dist/TouchLab-$VARIANT-5.0.0-unsigned.ipa" "$BUNDLE_ID"
          shasum -a 256 dist/*.ipa > dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TouchLab-${{ matrix.variant }}-5-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcode-log-${{ matrix.variant }}
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
